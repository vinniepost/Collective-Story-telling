<div class="map-wrapper">
  <div class="map-header">
    TACTICAL MAP OVERVIEW
  </div>
  <div class="map-container">

    <img ngSrc="assets/Map_ver2.png" width="800" height="450" alt="Tactical Map" class="map-image">

    <!-- Player Marker -->
    @if (playerLocation(); as loc) {
    <div class="player-marker" [style.left.%]="loc.x" [style.top.%]="loc.y">
      👤
    </div>
    }

    <!-- 21 Sections (Light Switches) -->
    @for (sec of sections(); track sec.id) {
    <app-map-button class="map-entity section-btn" [id]="sec.id" [action]="sec.id" [icon]="sec.lightsOn ? '💡' : '🌑'"
      [currentVotes]="votes()[sec.id] || 0" [totalClients]="totalClients()"
      [style.border-color]="sec.lightsOn ? 'yellow' : 'gray'"
      [style.background-color]="sec.lightsOn ? 'rgba(255, 255, 0, 0.3)' : 'rgba(0, 0, 0, 0.5)'"
      [style.box-shadow]="sec.lightsOn ? '0 0 15px yellow' : 'none'" (actionTriggered)="voteForEntity(sec.id)">
    </app-map-button>
    }

    <!-- 17 Doors -->
    @for (door of doors(); track door.id) {
    <app-map-button class="map-entity door-btn" [id]="door.id" [action]="door.id" [icon]="door.isClosed ? '🔒' : '🚪'"
      [currentVotes]="votes()[door.id] || 0" [totalClients]="totalClients()"
      [disabled]="(doorCooldown() > 0 && !door.isClosed)" [style.border-color]="door.isClosed ? 'red' : 'green'"
      (actionTriggered)="voteForEntity(door.id)">
    </app-map-button>
    }

  </div>

  @if (doorCooldown() > 0) {
  <div class="cooldown-warning">DOOR SYSTEM COOLING DOWN...</div>
  }
</div>
