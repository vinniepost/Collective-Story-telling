<div class="map-wrapper">
      <div class="map-header">
        TACTICAL MAP OVERVIEW
      </div>
      <div class="map-container">

        <img ngSrc="assets/Map_ver2.png" width="800" height="450" alt="Tactical Map" class="map-image">
        
        <!-- Player Marker -->
        @if (playerLocation(); as loc) {
          <div class="player-marker" 
               [style.left.%]="loc.x" 
               [style.top.%]="loc.y">
            👤
          </div>
        }

        <!-- Light Button -->
        <app-map-button 
                style="top: 45%; left: 55%;" 
                action="light"
                icon="💡"
                [currentVotes]="votes()['light'] || 0"
                [totalClients]="totalClients()"
                [disabled]="disabled()"
                (actionTriggered)="onAction($event)">
        </app-map-button>

        <!-- Close Door Button -->
        <app-map-button 
                style="top: 60%; left: 30%;" 
                action="close_door"
                icon="🚪"
                [currentVotes]="votes()['close_door'] || 0"
                [totalClients]="totalClients()"
                [disabled]="disabled()"
                (actionTriggered)="onAction($event)">
        </app-map-button>

        <!-- Sound 1 Button -->
        <app-map-button 
                style="top: 20%; left: 80%;" 
                action="sound_1"
                icon="🔊"
                [currentVotes]="votes()['sound_1'] || 0"
                [totalClients]="totalClients()"
                [disabled]="disabled()"
                (actionTriggered)="onAction($event)">
        </app-map-button>
        
        <!-- Sound 2 Button -->
        <app-map-button 
                style="top: 80%; left: 20%;" 
                action="sound_2"
                icon="🔔"
                [currentVotes]="votes()['sound_2'] || 0"
                [totalClients]="totalClients()"
                [disabled]="disabled()"
                (actionTriggered)="onAction($event)">
        </app-map-button>
      </div>
    </div>
